[project]
name = "clipforge"
version = "0.1.0"
description = "Generador local de clips verticales con IA (uso personal)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic-settings>=2.1",
    "sqlmodel>=0.0.14",
    "openai>=1.0",
    "faster-whisper>=0.10",
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "pytest>=7.4",
    "python-multipart>=0.0.6",
    "aiofiles>=23.1",
]

[project.scripts]
clipforge = "app.main:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
